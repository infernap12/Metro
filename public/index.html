<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adelaide Metro GTFS Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Adelaide Metro GTFS</h1>
      <div class="subtitle">Live vehicles, trip updates &amp; service alerts</div>
    </header>

    <section class="status">
      <div><strong>Vehicles:</strong> <span id="stat-vehicles">–</span></div>
      <div><strong>Feed time:</strong> <span id="stat-feed-time">–</span></div>
      <div><strong>Static version:</strong> <span id="stat-version">–</span></div>
      <div><strong>Last refresh:</strong> <span id="stat-refresh">–</span></div>
    </section>

    <section>
      <label class="toggle"><input type="checkbox" id="auto-refresh" checked /> Auto-refresh (15s)</label>
      <button id="refresh-now">Refresh now</button>
    </section>

    <section>
      <h2>Filter</h2>
      <input type="search" id="filter-route" placeholder="Route (e.g. 202, BTANIC)" autocomplete="off" />
      <label class="toggle"><input type="checkbox" id="layer-stops" /> Show stops</label>
      <label class="toggle"><input type="checkbox" id="layer-shapes" /> Show route shape</label>
    </section>

    <section>
      <div class="tabs">
        <button class="tab active" data-tab="routes">Routes</button>
        <button class="tab" data-tab="updates">Trip updates</button>
        <button class="tab" data-tab="alerts">Alerts</button>
      </div>
      <div class="tab-panels">
        <div class="panel active" data-panel="routes">
          <div class="hint">Top routes by live vehicle count. Click to filter.</div>
          <ul id="route-list" class="list"></ul>
        </div>
        <div class="panel" data-panel="updates">
          <div class="hint">Trips sorted by largest delay (seconds).</div>
          <ul id="updates-list" class="list"></ul>
        </div>
        <div class="panel" data-panel="alerts">
          <ul id="alerts-list" class="list"></ul>
        </div>
      </div>
    </section>

    <footer>
      Data: <a href="https://gtfs.adelaidemetro.com.au/" target="_blank" rel="noopener">gtfs.adelaidemetro.com.au</a>
    </footer>
  </aside>

  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
